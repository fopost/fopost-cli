name: Release

# Tagging v<version> cross-compiles every target with GoReleaser, publishes the
# GitHub Release with checksums, and pushes the Homebrew formula to the tap.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go vet ./...
      - run: go test -race ./...

      - name: Verify the tag matches the CLI version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(go run . version --json | sed -n 's/.*"version": "\([^"]*\)".*/\1/p')
          [ "$VERSION" = "$TAG" ] || { echo "::error::buildinfo says $VERSION but the tag is $TAG"; exit 1; }

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token with write access to fopost/homebrew-tap. The built-in
          # GITHUB_TOKEN cannot push to another repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
