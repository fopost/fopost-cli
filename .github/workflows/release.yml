name: Release

# Tagging v<version> cross-compiles every target with GoReleaser, publishes the
# GitHub Release with checksums, and pushes the Homebrew formula to the tap.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go vet ./...
      - run: go test -race ./...

      - name: Verify the tag matches the CLI version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(go run . version --json | sed -n 's/.*"version": "\([^"]*\)".*/\1/p')
          [ "$VERSION" = "$TAG" ] || { echo "::error::buildinfo says $VERSION but the tag is $TAG"; exit 1; }

      # The formula needs a token that can write to fopost/homebrew-tap, which
      # the built-in GITHUB_TOKEN cannot do. Until that secret exists, publish
      # the binaries and skip the tap rather than failing the whole release.
      - name: Decide whether the Homebrew formula can publish
        id: brew
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo 'args=release --clean' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::HOMEBREW_TAP_TOKEN is not set — publishing binaries without the Homebrew formula.'
            echo 'args=release --clean --skip=homebrew' >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.brew.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
